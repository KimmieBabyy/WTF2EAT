<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTF Should I Eat?!</title>

<style>
body{
    font-family: "Trebuchet MS", Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #fff3c4, transparent 35%),
        radial-gradient(circle at bottom right, #ffd6c9, transparent 35%),
        linear-gradient(135deg,#fff8e7,#ffe0cc);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    text-align:center;
}

.card{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(12px);
    padding:32px 26px;
    border-radius:28px;
    box-shadow:0 16px 35px rgba(143,89,59,.22);
    max-width:360px;
    width:86%;
    border:2px solid rgba(255,255,255,.7);
}

.emoji{
    font-size:3rem;
    margin-bottom:8px;
}

h1{
    margin:0;
    font-size:2rem;
    color:#5a3b2e;
    line-height:1.1;
}

.subtitle{
    color:#9b6b55;
    margin-top:10px;
    font-size:.95rem;
}

#result{
    font-size:1.7rem;
    margin:28px 0;
    min-height:70px;
    font-weight:bold;
    color:#4a2f25;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    background:linear-gradient(135deg,#ff9a76,#ff6f61);
    color:white;
    border:none;
    padding:15px 30px;
    font-size:1rem;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(255,111,97,.35);
    transition:.2s;
    font-weight:bold;
}

button:hover{
    transform:translateY(-2px) scale(1.04);
}

button:active{
    transform:scale(.96);
}

.sparkle{
    position:absolute;
    font-size:1.2rem;
    opacity:.7;
}

.s1{ top:18%; left:18%; }
.s2{ top:22%; right:18%; }
.s3{ bottom:20%; left:22%; }
.s4{ bottom:18%; right:20%; }
</style>
</head>

<body>

<div class="sparkle s1">✨</div>
<div class="sparkle s2">🍓</div>
<div class="sparkle s3">⭐</div>
<div class="sparkle s4">🍒</div>

<div class="card">
    <div class="emoji">🍽️</div>
    <h1>WTF Should I Eat?!</h1>
    <div class="subtitle">because deciding is too much work</div>

    <div id="result">tap below bestie</div>

    <button onclick="pickFood()">I’m Hungry</button>
</div>

<script>
const foods = [
"🍕 Pizza",
"🌮 Tacos",
"🍔 Burger",
"🍣 Sushi",
"🍜 Ramen",
"🥗 Salad",
"🌯 Burrito",
"🍗 Fried Chicken",
"🥪 Sandwich",
"🥟 Dumplings",
"🍝 Pasta",
"🥘 Curry",
"🍳 Breakfast",
"🥞 Pancakes",
"🌮 Birria Tacos",
"🍛 Butter Chicken",
"🍚 Chinese Takeout",
"🥩 Steak",
"🧀 Grilled Cheese",
"🥔 Loaded Fries",
"🌯 Quesadilla",
"🥙 Gyro",
"🍦 Ice Cream",
"🥤 Boba",
"🍟 Fries",
"🍗 Wings",
"🍲 Pho",
"🥡 Panda Express",
"😅 Whatever’s in the fridge"
];

let spinning = false;

function pickFood(){
    if(spinning) return;
    spinning = true;

    const result = document.getElementById("result");
    let count = 0;

    const spin = setInterval(() => {
        result.textContent = foods[Math.floor(Math.random()*foods.length)];
        count++;
    }, 80);

    setTimeout(() => {
        clearInterval(spin);
        const choice = foods[Math.floor(Math.random()*foods.length)];
        result.textContent = "👉 " + choice;

        result.animate([
            {transform:"scale(.8)", opacity:.5},
            {transform:"scale(1.18)", opacity:1},
            {transform:"scale(1)", opacity:1}
        ],{
            duration:450
        });

        spinning = false;
    }, 1800);
}
</script>

</body>
</html>
