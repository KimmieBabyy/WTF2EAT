<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ WTF Should I Eat?!</title>
<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#ffe082,#ffcc80);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
        text-align:center;
    }
    .card{
        background:white;
        padding:30px;
        border-radius:20px;
        box-shadow:0 8px 20px rgba(0,0,0,.2);
        max-width:350px;
        width:90%;
    }
    h1{
        margin-top:0;
    }
    #result{
        font-size:1.5rem;
        margin:25px 0;
        min-height:60px;
        font-weight:bold;
    }
    button{
        background:#ff7043;
        color:white;
        border:none;
        padding:14px 28px;
        font-size:1rem;
        border-radius:30px;
        cursor:pointer;
    }
    button:hover{
        background:#f4511e;
    }
</style>
</head>
<body>

<div class="card">
    <h1>🍽️ WTF do I eat?!</h1>
    <div id="result">Tap the button!</div>
    <button onclick="pickFood()">I'm Hungry</button>
</div>

<script>
const foods = [
"🍕 Pizza",
"🌮 Tacos",
"🍔 Burger",
"🍣 Sushi",
"🍜 Ramen",
"🥗 Salad",
"🌯 Burrito",
"🍗 Fried Chicken",
"🥪 Sandwich",
"🥟 Dumplings",
"🍝 Pasta",
"🌭 Hot Dog",
"🥘 Curry",
"🍳 Breakfast",
"🥞 Pancakes",
"🌮 Birria Tacos",
"🍛 Butter Chicken",
"🍚 Chinese Takeout",
"🥩 Steak",
"🧀 Grilled Cheese",
"🥔 Loaded Fries",
"🌯 Quesadilla",
"🥙 Gyro",
"🍦 Ice Cream"
];

function pickFood(){
    const choice = foods[Math.floor(Math.random()*foods.length)];
    document.getElementById("result").textContent = choice;
}
</script>

</body>
</html>
